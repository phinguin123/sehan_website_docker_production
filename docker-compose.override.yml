# Development overrides
# Usage: docker compose up -d

services:
  backend:
    environment:
      FLASK_ENV: development
    ports:
      - "5002:5002"
    volumes:
      - ./backend:/app
    command: ["python3", "app.py", "5002"]

  frontend:
    image: node:lts-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache npm && npm ci --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled/docker-dev.conf:/etc/nginx/sites-enabled/default:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    ports:
      - "3306:3306"
