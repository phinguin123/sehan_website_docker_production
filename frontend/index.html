    <script defer src="/_vercel/insights/script.js"></script>

    <style>
      :root {
        /* Inner shadow */
        --shadow-offset: 0;
        --shadow-blur: 20px;
        --shadow-spread: -5px;
        --shadow-color: rgb(255, 255, 255);

        /* Painted glass */
        --tint-color: 255, 255, 255;
        --tint-opacity: 0.001;

        /* Background frost */
        --frost-blur: 8px;

        /* SVG noise/distortion */
        --noise-frequency: 0.008;
        --distortion-strength: 77;

        /* Outer shadow blur */
        --outer-shadow-blur: 24px;
      }
      #controls {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        max-width: 280px;
        max-height: 90vh;
        overflow-y: auto;
      }

      #controls h2 {
        margin: 8px 0 4px;
        font-size: 16px;
      }

      #controls label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 4px 0;
      }

      #controls input[type="range"] {
        width: 140px;
      }

      #controls input[type="color"],
      #controls input[type="text"] {
        border: none;
        padding: 0;
        width: 120px;
        height: 24px;
        background: #fff;
        color: #000;
        font-size: 12px;
      }

      .glassDiv {
        width: 100%;
        height: 100%;
        position: relative;
        border-radius: 28px;
        cursor: move;
        isolation: isolate;
        touch-action: none;
        /* enable pointer dragging on touch */
        box-shadow: 0px 6px var(--outer-shadow-blur) rgba(0, 0, 0, 0.1);
      }

      .glassDiv::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 28px;
        box-shadow: inset var(--shadow-offset) var(--shadow-offset)
          var(--shadow-blur) var(--shadow-spread) var(--shadow-color);
        background-color: rgba(var(--tint-color), var(--tint-opacity));
      }

      .glassDiv::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 28px;
        backdrop-filter: blur(var(--frost-blur));
        filter: url(#glass-distortion);
        isolation: isolate;
        -webkit-backdrop-filter: blur(var(--frost-blur));
        -webkit-filter: url("#glass-distortion");
      }
    </style>
