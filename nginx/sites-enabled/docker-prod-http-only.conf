# Temporary HTTP-only Production Nginx Configuration
# Use this until SSL certificates are obtained for sehanibp.kr

# Production server - sehanibp.kr (HTTP ONLY - NO SSL)
server {
    listen 80;
    server_name sehanibp.kr www.sehanibp.kr;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:5000;
    
    # Preserve original request URI for file serving
    set $original_uri $request_uri;

    # Proxy /get-week-number to backend (must come before / location)
    location = /get-week-number {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100m;

        proxy_connect_timeout 240;
        proxy_send_timeout 240;
        proxy_read_timeout 240;
        send_timeout 240;
    }

    # API reverse proxy to Flask backend - specific route for files
    location /api/files/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100m;

        proxy_connect_timeout 240;
        proxy_send_timeout 240;
        proxy_read_timeout 240;
        send_timeout 240;
    }

    # API reverse proxy to Flask backend - general API routes
    location ~ ^/api/(.*)$ {
        proxy_pass http://$backend_upstream/api/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100m;

        proxy_connect_timeout 240;
        proxy_send_timeout 240;
        proxy_read_timeout 240;
        send_timeout 240;
    }

    # Proxy /student/ routes to backend
    location /student/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100m;

        proxy_connect_timeout 240;
        proxy_send_timeout 240;
        proxy_read_timeout 240;
        send_timeout 240;
    }

    # Frontend static files (served by frontend container)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100m;
    }
}
