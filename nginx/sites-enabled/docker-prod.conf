# 1. HTTP Redirect Block (Port 80)
# Redirects all traffic from http:// -> https://
server {
    listen 80;
    server_name sehanibp.kr www.sehanibp.kr;

    # Redirect all HTTP requests to HTTPS with a 301 Moved Permanently response.
    return 301 https://$host$request_uri;
}

# 2. HTTPS Block (Port 443)
# Handles the actual traffic
server {
    listen 443 ssl;
    server_name sehanibp.kr www.sehanibp.kr;

    # --- SSL CONFIGURATION ---
    # Ensure these filenames match what you put in /etc/ssl/sehanibp.kr/ on the host
    # If you named your bundle 'fullchain.crt', change the extension below to .crt
    ssl_certificate     /etc/ssl/sehanibp.kr/fullchain.pem;
    ssl_certificate_key /etc/ssl/sehanibp.kr/www_sehanibp.kr.pem;

    # Security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- YOUR EXISTING LOGIC BELOW ---
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:5000;
    
    # Preserve original request URI for file serving
    set $original_uri $request_uri;

    # Proxy /get-week-number to backend
    location = /get-week-number {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100m;

        proxy_connect_timeout 240;
        proxy_send_timeout 240;
        proxy_read_timeout 240;
        send_timeout 240;
    }

    # API reverse proxy to Flask backend - specific route for files
    location /api/files/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100m;

        proxy_connect_timeout 240;
        proxy_send_timeout 240;
        proxy_read_timeout 240;
        send_timeout 240;
    }

    # API reverse proxy to Flask backend - general API routes
    location ~ ^/api/(.*)$ {
        proxy_pass http://$backend_upstream/api/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100m;

        proxy_connect_timeout 240;
        proxy_send_timeout 240;
        proxy_read_timeout 240;
        send_timeout 240;
    }

    # Proxy /student/ routes to backend
    location /student/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100m;

        proxy_connect_timeout 240;
        proxy_send_timeout 240;
        proxy_read_timeout 240;
        send_timeout 240;
    }

    # Frontend static files (served by frontend container)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100m;
    }
}