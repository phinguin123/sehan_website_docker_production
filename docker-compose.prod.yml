# Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  backend:
    env_file:
      - env.local  # Load environment variables from env.local file
    environment:
      FLASK_ENV: production
      APP_MODE: production
      TZ: Asia/Seoul
    ports: []
    volumes:
      - ./backend:/app  # Mount backend directory for code and secret config files
      - /home/ubuntu/sehan_website/homework:/home/ubuntu/sehan_website/homework  # Mount homework upload directory
    command: ["gunicorn", "-b", "0.0.0.0:5000", "--access-logfile", "-", "--error-logfile", "-", "--log-level", "info", "--capture-output", "app:app"]  # Serve Flask via Gunicorn on port 5000, logs to stdout/stderr

  frontend:
    ports: []
    volumes: []

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled/docker-prod.conf:/etc/nginx/sites-enabled/default:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount SSL certificates from host (actual certificates, not certbot)
      - /etc/ssl/sehanibp.kr:/etc/ssl/sehanibp.kr:ro
      - /etc/ssl/dev.sehanibp.kr:/etc/ssl/dev.sehanibp.kr:ro
    # Note: If dev.sehanibp.kr uses the same certificate as sehanibp.kr,
    # you can remove the dev.sehanibp.kr mount above

  redis:
    ports: []  # Don't expose Redis port externally - only used internally by containers

  celery-worker:
    env_file:
      - env.local
    environment:
      FLASK_ENV: production
      APP_MODE: production
      TZ: Asia/Seoul
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
      # Mount a directory for temporary recording storage (files are uploaded to FTP then can be cleaned up)
      - /home/ubuntu/sehan_website/recordings:/app/recordings

  celery-beat:
    env_file:
      - env.local
    environment:
      FLASK_ENV: production
      APP_MODE: production
      TZ: Asia/Seoul
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app

  flower:
    env_file:
      - env.local
    environment:
      FLASK_ENV: production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"  # Keep Flower accessible for monitoring

  # db service is not needed - using AWS RDS


